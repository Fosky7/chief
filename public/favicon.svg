<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  role="img"
  aria-label="ChiefCap logo"
  focusable="false"
>
  <title>ChiefCap logo</title>
  <desc>Chief chief's-cap brand mark</desc>
  <defs>
    <!--
      Literal HSL stops. A static file cannot resolve CSS custom properties,
      so these are hard-coded here and stay in sync with `logo.stops` in
      src/config/theme.ts (rose / amber / indigo). Do not edit one without the
      other. Geometry mirrors `logo.mark` verbatim.
    -->
    <linearGradient id="chief-brand-mark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="hsl(346 84% 58%)" />
      <stop offset="0.45" stop-color="hsl(38 94% 55%)" />
      <stop offset="1" stop-color="hsl(248 72% 62%)" />
    </linearGradient>
  </defs>
  <!-- Rounded square plate (radius 14) -->
  <rect x="0" y="0" width="64" height="64" rx="14" ry="14" fill="url(#chief-brand-mark)" />
  <!-- Cap dome -->
  <path d="M16 38a16 16 0 0 1 32 0Z" fill="hsl(0 0% 100%)" />
  <!-- Cap band -->
  <rect x="13" y="37.5" width="38" height="7" rx="3.5" ry="3.5" fill="hsl(0 0% 100%)" />
  <!-- Crown button -->
  <circle cx="32" cy="16" r="3" fill="hsl(0 0% 100%)" />
</svg>
